[project]
name = "kiseki"
version = "0.1.0"
description = "Kiseki — the trip as a living, agent-maintained document"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.9",
    "playwright>=1.49.0",
    "konnektr-graph==0.3.8",
    "PyJWT[crypto]>=2.10.0",
    # S3-compatible Garage media backend (issue #47). Lazy-imported at store
    # init so dev/tests without the package still work.
    "minio>=7.2.0,<8",
    "tricount-api>=0.1.2",
    # HTTP client for the chat relay (issue #9/M3 — /api/chat streams the
    # kiseki agent's Responses-API turn over httpx). RUNTIME dep (the slim
    # image installs [project] only — dev-group httpx never reached the pod).
    "httpx>=0.27.0",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
